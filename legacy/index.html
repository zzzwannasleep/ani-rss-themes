<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ani-rss 主题预览</title>
    <meta name="description" content="ani-rss 自定义 CSS 主题的在线预览：真实 Element Plus 样式表 + 1:1 复刻的界面结构、交互与动效"/>

    <!-- 1. Element Plus 组件样式：和 ani-rss 实际用的是同一份（MIT，见 preview/NOTICE.md） -->
    <link rel="stylesheet" href="preview/element-plus.css"/>
    <!-- 2. ani-rss 自己那层样式：热链上游仓库，不落地，自动跟版本（GPL-2.0，见 preview/NOTICE.md）。
         路径是 src/css/ 下的两份，别写回 src/style.css —— 上游改版时把它挪进了 css/ 目录，
         旧地址会 404，而 404 的表现只是「界面忽然变得又素又挤」，一点报错都没有。 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wushuo894/ani-rss@master/ani-rss-ui/src/css/style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wushuo894/ani-rss@master/ani-rss-ui/src/css/ext.css"/>
    <!-- 3. 组件布局层：上游把这些写在 .vue 的 scoped style 里，热链拿不到，只能照数值复刻 -->
    <link rel="stylesheet" href="preview/app.css"/>

    <style>
        html, body {
            height: 100%;
        }

        body {
            padding-top: 44px;
            box-sizing: border-box;
            overflow: hidden;
        }

        #app {
            height: 100%;
        }

        #app > .content {
            height: 100%;
        }

        .el-scrollbar {
            height: 100%;
        }

        /* ===== 预览页控制栏（不用 el- 前缀，免得被主题染色） ===== */
        .pv-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            z-index: 5000;
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 0 10px;
            background: #0d0f13;
            border-bottom: 1px solid #232830;
            /* 按钮现在钉成单行了，窄屏上总宽会超出去 —— 让它横着滑，别把最后一颗裁掉。
               滚动条自己不显示，44px 高的横条里塞一根滚动条等于白占 12px */
            overflow-x: auto;
            scrollbar-width: none;
        }

        .pv-bar::-webkit-scrollbar {
            display: none;
        }

        /* 主题会把字距、大小写、字重全改掉，控制栏必须用 !important 把自己钉住 ——
           不然霓虹／终端这类「全大写 + 字距拉宽」的主题一上，按钮文字就开始折行，
           44px 高的横条瞬间变成两行。 */
        .pv-bar, .pv-bar * {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif !important;
            font-size: 13px !important;
            color: #e8ecf2;
            letter-spacing: 0 !important;
            text-transform: none !important;
            font-weight: 400 !important;
            white-space: nowrap !important;
            line-height: 1.2;
        }

        .pv-bar select, .pv-bar button {
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid #333842;
            background: #171a21;
            cursor: pointer;
        }

        .pv-bar button.on {
            border-color: #3f6fa8;
            background: #16283c;
        }

        .pv-bar button:hover:not(:disabled) {
            border-color: #4a5262;
            background: #1e232c;
        }

        /* 配套 JS 的按钮走金色，跟旁边三个复制 CSS 的区分开 */
        .pv-bar button.pv-js {
            border-color: #5a4c26;
            background: #221d10;
            color: #DEBC60;
        }

        .pv-bar button.pv-js:hover:not(:disabled) {
            border-color: #7f6b34;
            background: #2d2615;
        }

        .pv-bar button.done {
            border-color: #2f7d54;
            background: #14301f;
            color: #7ee2a8;
        }

        .pv-grow {
            flex: 1;
        }

        .pv-note {
            color: #6f7784 !important;
        }

        @media (max-width: 1240px) {
            .pv-hint {
                display: none;
            }
        }

        /* ===== 弹窗：补上 Vue 侧本来负责的定位 ===== */
        .el-overlay {
            z-index: 2001;
        }

        .el-overlay-dialog {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .el-dialog {
            margin: 0;
            max-height: calc(100vh - 88px);
            display: flex;
            flex-direction: column;
        }

        .el-dialog__body {
            overflow: auto;
            flex: 1;
        }

        .pv-popper {
            position: fixed;
            z-index: 3000;
        }

        .el-collapse-item__wrap {
            overflow: hidden;
            transition: max-height var(--el-transition-duration) ease-in-out;
        }

        /* 竖向标签页（添加订阅 / 修改订阅）内的滚动区 */
        .pv-pane-scroll {
            max-height: 52vh;
            overflow: auto;
            padding-right: 6px;
        }

        /* 设置弹窗里三个重内容的面板：上游是 height:500px + el-scrollbar */
        .pv-tall {
            height: 500px;
            max-height: 52vh;
            overflow: auto;
            padding: 0 12px;
        }

        /* 设置的确定/取消在 body 底部右侧，不是 footer */
        .el-dialog__body > .action {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-top: 8px;
        }

        /* 设置里「其他」四个开关真的作用于列表 */
        .no-score .list-card-score-container,
        .no-time .list-card-time,
        .no-week .list-week-title,
        .no-playlist .list-card-playlist {
            display: none;
        }

        .list-card-url {
            max-width: 300px;
            display: none;
        }

        .no-score .list-card-url {
            display: -webkit-box;
        }

        .pv-logline {
            display: block;
            white-space: pre-wrap;
        }

        .pv-logline i {
            font-style: normal;
            opacity: .55;
        }

        .pv-log-INFO {
            color: #8fbcbb;
        }

        .pv-log-WARN {
            color: #ebcb8b;
        }

        .pv-log-ERROR {
            color: #bf616a;
        }

        .pv-log-DEBUG {
            color: #81a1c1;
        }
    </style>

    <!--
      4. 主题：最后加载，覆盖以上全部。

      用脚本创建 link 而不是写死 <link> 再改 href —— 换主题走 ?t= 参数重载页面，
      保证一次页面生命周期里只存在一张主题表。某些「网页强制深色」类浏览器扩展会把每张
      样式表克隆成内联 <style>，运行时改 href 的话旧主题的克隆会留在文档末尾盖过新主题。
      URL 可以直接分享到具体主题：?t=neon.css
    -->
    <script>
        (function () {
            var t = new URLSearchParams(location.search).get('t')
                || localStorage.getItem('ani-preview-theme') || 'paper.css'
            if (!/^[a-z0-9.-]+\.css$/.test(t)) t = 'paper.css'
            var l = document.createElement('link')
            l.rel = 'stylesheet'
            l.id = 'theme'
            l.href = 'themes/' + t
            document.head.appendChild(l)
            window.__theme = t
        })()
    </script>
</head>
<body>

<div class="pv-bar">
    <label for="pick">主题</label>
    <select id="pick"></select>
    <button id="mode" type="button">切换深色</button>
    <span class="pv-note" id="modeNote"></span>
    <button id="loginToggle" type="button">看登录页</button>
    <!-- 新界面的预览在另一个目录：那边是真的 Vue app，不是这套 1:1 复刻的静态骨架。
         「共 N 款」里的数字由 .github/workflows/pages.yml 发布时按 ids.ts 重写 ——
         手写的数字烂过一次：加到第六款时这里还写着五款，一直挂在站点首页上。 -->
    <button onclick="location.href='webui/'" title="Vue 3 + Vuetify 3 的替代界面，共 9 款" type="button">WebUI 预览 →</button>
    <span class="pv-note pv-hint">顶部按钮可打开各弹窗</span>
    <span class="pv-grow"></span>
    <span class="pv-note pv-hint" id="pasteHint">复制到 设置 → 基础设置 → 页面设置 → 自定义 → CSS</span>
    <button id="copyPages" type="button" title="@import GitHub Pages">复制链接 · GitHub</button>
    <button id="copyGithack" type="button" title="@import githack（备用源，缓存只有 60 秒，改完一分钟内生效）">复制链接 · githack</button>
    <button id="copyCss" type="button" title="把整份 CSS 复制走，离线可用">复制 CSS 全文</button>
    <!-- 只有配了 JS 的主题才留着，文字和 title 由 preview.js 按当前档位写 -->
    <button id="copyJs" class="pv-js" type="button"></button>
</div>

<div id="app">

    <!-- ============ 订阅页（对应 home/MainLayoutView.vue + home/SubscriptionView.vue） ============
         上游改版后，主界面不再是「顶部一条工具栏 + 卡片列表」，而是「左侧 132px 导航栏 + 右侧路由页」，
         订阅页里再套一层页头（标题 + 副标题）和工具条，列表也从「一行一条的卡片」换成了「海报墙」。
         预览原先复刻的是改版前那一版，于是这里看到的样子和装上去的样子不是一个界面 ——
         主题又是照 DOM 写选择器的，预览再准也没用。下面这一层按现在的结构重搭。 -->
    <div class="app-shell" id="home-view">
        <aside class="app-nav">
            <div class="app-brand">
                <svg class="app-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="6" cy="18" r="2.6" fill="currentColor"/>
                    <path d="M4 11.2A8.8 8.8 0 0 1 12.8 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                    <path d="M4 4.6A15.4 15.4 0 0 1 19.4 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
                <span>ANI-RSS</span>
            </div>
            <!-- 五项由 preview.js 按上游的图标和顺序渲染；点了会跳到对应的弹窗 -->
            <ul class="el-menu app-menu" id="nav" role="menubar"></ul>
        </aside>

        <main class="app-main">
            <div class="subscription-page app-page-layout" id="subs-view">
                <header class="page-header app-page-padding">
                    <div class="page-header-heading">
                        <h2 class="page-header-title">订阅</h2>
                        <span class="el-text el-text--info el-text--small page-header-subtitle" id="subs-count"></span>
                    </div>
                    <div class="page-header-actions"></div>
                </header>

                <div class="subscription-body app-page-content app-page-padding">
                    <div class="subscription-toolbar">
                        <div class="subscription-filters">
                            <div class="el-input el-input--prefix subscription-search">
                                <div class="el-input__wrapper">
                                    <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="search"></i></span></span>
                                    <input class="el-input__inner" id="search" type="text" placeholder="搜索"/>
                                </div>
                            </div>
                            <div class="el-select subscription-select" data-select="month">
                                <div class="el-select__wrapper">
                                    <div class="el-select__selection">
                                        <div class="el-select__selected-item el-select__placeholder is-transparent"><span data-value>日期</span></div>
                                    </div>
                                    <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                                </div>
                            </div>
                            <div class="el-select subscription-select" data-select="enable">
                                <div class="el-select__wrapper">
                                    <div class="el-select__selection">
                                        <div class="el-select__selected-item el-select__placeholder"><span data-value>已启用</span></div>
                                    </div>
                                    <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                                </div>
                            </div>
                        </div>
                        <div class="subscription-actions" id="toolbar"></div>
                    </div>

                    <div class="list-container">
                        <div class="el-scrollbar hide-scrollbar">
                            <div class="el-scrollbar__wrap">
                                <div class="el-scrollbar__view">
                                    <div class="list-content" id="list"></div>
                                    <div class="list-bottom-spacer"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!--
                日志（home/LogsView.vue）。上游 3.2.6x 把它从弹窗改成了独立页面 ——
                页头三颗动作、工具条三个筛选、四列（时间/级别/来源/内容）的表格化列表。
                预览以前把它塞在 el-dialog 里，弹窗尺寸下四列挤成两行，主题的
                .logs-page 那几条规则也就永远量不准。
            -->
            <div class="logs-page app-page-layout" id="logs-view" style="display: none;">
                <header class="page-header app-page-padding">
                    <div class="page-header-heading">
                        <h2 class="page-header-title">日志</h2>
                        <span class="el-text el-text--info el-text--small page-header-subtitle" id="logs-count">共 0 条 · 显示 0 条</span>
                    </div>
                    <div class="page-header-actions log-actions">
                        <button type="button" class="el-button auto-button" data-act="logs-download">
                            <i class="el-icon" data-icon="download"></i><span>下载</span></button>
                        <button type="button" class="el-button auto-button" data-act="logs-refresh">
                            <i class="el-icon" data-icon="refresh"></i><span>刷新</span></button>
                        <button type="button" class="el-button el-button--danger auto-button" data-act="mb-clear-logs">
                            <i class="el-icon" data-icon="del"></i><span>清空</span></button>
                    </div>
                </header>
                <div class="logs-body app-page-content app-page-padding">
                    <section class="logs-toolbar" aria-label="日志筛选">
                        <div class="el-input el-input--prefix log-search">
                            <div class="el-input__wrapper">
                                <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="search"></i></span></span>
                                <input class="el-input__inner" id="log-search" type="text" placeholder="搜索日志"/>
                            </div>
                        </div>
                        <div class="el-select level-select" data-select="log-level">
                            <div class="el-select__wrapper">
                                <div class="el-select__selection">
                                    <div class="el-select__selected-item el-select__placeholder is-transparent"><span data-value>日志等级</span></div>
                                </div>
                                <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                            </div>
                        </div>
                        <div class="el-select logger-select" data-select="log-logger">
                            <div class="el-select__wrapper">
                                <div class="el-select__selection">
                                    <div class="el-select__selected-item el-select__placeholder is-transparent"><span data-value>来源</span></div>
                                </div>
                                <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                            </div>
                        </div>
                    </section>
                    <div class="log-viewer">
                        <div class="log-columns" aria-hidden="true">
                            <span>时间</span><span>级别</span><span>来源</span><span>内容</span>
                        </div>
                        <div class="el-scrollbar logs-scrollbar">
                            <div class="el-scrollbar__wrap">
                                <div class="el-scrollbar__view">
                                    <div class="log-list" id="log-list"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ============ 登录页 ============ -->
    <div class="flex-center content" id="login-view" style="display: none; flex-flow: column; justify-content: space-between;">
        <div id="login-page" class="flex-center">
            <div id="form">
                <div style="text-align: center;">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" style="opacity:.9">
                        <circle cx="6" cy="18" r="2.2" fill="currentColor"/>
                        <path d="M4 11.5a8.5 8.5 0 0 1 8.5 8.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M4 5a15 15 0 0 1 15 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2 class="title-h2">ANI-RSS</h2>
                <form class="el-form el-form--default" onsubmit="return false">
                    <div class="el-form-item">
                        <div class="el-form-item__content">
                            <div class="el-input el-input--prefix full-width">
                                <div class="el-input__wrapper">
                                    <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="user"></i></span></span>
                                    <input class="el-input__inner" type="text" placeholder="用户名" autocomplete="off"/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="el-form-item">
                        <div class="el-form-item__content">
                            <div class="el-input el-input--prefix el-input--suffix full-width">
                                <div class="el-input__wrapper">
                                    <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="key"></i></span></span>
                                    <input class="el-input__inner" type="password" placeholder="密码" autocomplete="off"/>
                                    <span class="el-input__suffix"><span class="el-input__suffix-inner"><i class="el-icon el-input__icon" data-icon="view"></i></span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-center action">
                        <label class="el-checkbox"><span class="el-checkbox__input"><span class="el-checkbox__inner"></span></span><span class="el-checkbox__label">记住密码</span></label>
                        <button type="button" class="el-button is-text is-has-bg" data-act="login"><i class="el-icon" data-icon="right"></i><span>登录</span></button>
                    </div>
                </form>
            </div>
        </div>
        <div class="footer">
            <a class="el-link el-link--default" href="https://docs.wushuo.top" target="_blank"><span class="el-link__inner">ani-rss</span></a>
            &nbsp;
            <a class="el-link el-link--default" href="https://github.com/wushuo894/ani-rss" target="_blank"><span class="el-link__inner">github</span></a>
        </div>
    </div>

</div>

<div id="dialogs"></div>

<script src="preview/data.js"></script>
<script src="preview/preview.js"></script>

</body>
</html>
